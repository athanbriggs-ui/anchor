<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anchor</title>
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2026;--mute:#6b7280;--line:#e4e0d6;--accent:#d8432e;--accent-ink:#fff;--ok:#2f8f5b;--soft:#efeae0;--warn:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1e2127;--ink:#eceae4;--mute:#9aa1ad;--line:#2d313a;--accent:#ef5a44;--accent-ink:#fff;--ok:#4fb37e;--soft:#262a32;--warn:#e0a84a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:22px 0 8px;font-weight:700}
p{margin:6px 0}.mute{color:var(--mute)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.pri,.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button.ghost{background:transparent}button.big{width:100%;padding:14px;font-size:17px}
button.x{min-height:36px;padding:4px 10px;background:transparent;border:0;color:var(--mute)}
input,textarea,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px}
textarea{min-height:110px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.step{font-size:19px;font-weight:650;line-height:1.3}
.of{font-size:13px;color:var(--mute);margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-height:36px;padding:6px 12px;border-radius:999px;font-size:14px}
.banner{border-left:4px solid var(--accent)}.banner.calm{border-left-color:var(--ok)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--soft);font-size:13px}
.pill.hot{background:var(--accent);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;max-width:120px;border:0;background:transparent;border-radius:0;flex-direction:column;gap:2px;font-size:11px;color:var(--mute);min-height:60px;padding:6px 2px}
nav button span{font-size:21px;line-height:1}nav button.on{color:var(--accent);font-weight:700}
#fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);border:0;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:6}
dialog{border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);padding:18px;width:min(520px,calc(100vw - 24px));max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}dialog h3{margin:0 0 8px;font-size:20px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-80px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;transition:transform .25s;z-index:99;max-width:92vw;text-align:center;font-size:15px}
#toast.show{transform:translate(-50%,0)}
.pie{display:block;margin:6px auto;width:min(78vw,320px);height:auto}
.digits{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.done{opacity:.5;text-decoration:line-through}
details{border-top:1px solid var(--line);padding:10px 0}details:first-of-type{border-top:0}summary{cursor:pointer;font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}.check:first-child{border-top:0}
.check input{width:24px;height:24px;min-height:0;flex:none;margin-top:1px;accent-color:var(--ok)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="view"></main>
<button id="fab" data-a="capture" aria-label="Quick capture a thought">✎</button>
<nav id="nav"></nav>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>
<script>
'use strict';
/* ---------- state ---------- */
const KEY='anchor.v1';
const DEF={day:'',tab:'today',tasks:[],inbox:[],stacks:[],appts:[],wins:[],moves:{},guard:{},shown:[],timer:null,
  set:{limit:3,buffer:15,chime:5,buddy:'',phone:''}};
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');return {...structuredClone(DEF),...s,set:{...DEF.set,...(s.set||{})}}}catch(e){return structuredClone(DEF)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const dkey=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const hm=d=>d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
function modal(html){const d=$('#dlg');d.innerHTML=html;if(!d.open)d.showModal();const f=d.querySelector('[autofocus]');if(f)setTimeout(()=>f.focus(),50)}
function closeModal(){const d=$('#dlg');if(d.open)d.close()}

/* ---------- new day: soft reset, no guilt ---------- */
function rollover(){
  const t=dkey();if(S.day===t)return;
  S.tasks=S.tasks.filter(x=>!x.done);
  if(S.day)S.tasks.forEach(x=>x.stale=true);
  S.appts=S.appts.filter(a=>new Date(a.when).getTime()>Date.now()-864e5);
  S.day=t;S.tab='today';save();
}
function win(text){S.wins.unshift({t:text,ts:Date.now()});S.wins=S.wins.slice(0,400);if(!S.shown.includes(dkey()))S.shown.push(dkey());save()}
const winsToday=()=>S.wins.filter(w=>dkey(new Date(w.ts))===dkey());

/* ---------- sound + notifications ---------- */
let AC;
function audio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(freq=660,dur=.18,n=1){if(!AC)return;for(let i=0;i<n;i++){const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*(dur+.12);
  o.frequency.value=freq;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02)}}
function notify(title,body){try{if(!('Notification'in window)||Notification.permission!=='granted')return;
  if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon.svg',vibrate:[200,100,200]}));
  else new Notification(title,{body})}catch(e){}}
if(navigator.vibrate===undefined)navigator.vibrate=()=>{};

/* ---------- appointments: buffer maths ---------- */
function apptTimes(a){const w=new Date(a.when).getTime(),buf=+a.buffer||0;
  const leave=w-((+a.travel||0)+buf)*6e4,ready=leave-(+a.prep||0)*6e4;return{when:new Date(w),leave:new Date(leave),ready:new Date(ready)}}
const icsDate=d=>`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function ics(a){const t=apptTimes(a),end=new Date(t.when.getTime()+36e5),ml=Math.round((t.when-t.leave)/6e4),mr=Math.round((t.when-t.ready)/6e4);
  const al=(m,d)=>`BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${d}\r\nTRIGGER:-PT${m}M\r\nEND:VALARM\r\n`;
  const clean=s=>String(s).replace(/[,;\\]/g,' ').replace(/\n/g,' ');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Anchor//EN\r\nBEGIN:VEVENT\r\nUID:${a.id}@anchor\r\nDTSTAMP:${icsDate(new Date())}\r\nDTSTART:${icsDate(t.when)}\r\nDTEND:${icsDate(end)}\r\nSUMMARY:${clean(a.title)}\r\nDESCRIPTION:Get ready ${hm(t.ready)} - LEAVE BY ${hm(t.leave)} (includes ${a.buffer} min buffer)\r\n${mr>ml?al(mr,'Start getting ready: '+clean(a.title)):''}${al(ml+10,'10 min until you must leave: '+clean(a.title))}${al(ml,'LEAVE NOW: '+clean(a.title))}END:VEVENT\r\nEND:VCALENDAR\r\n`}
function gcal(a){const t=apptTimes(a);const u=new URLSearchParams({action:'TEMPLATE',text:`Leave ${hm(t.leave)} → ${a.title}`,dates:`${icsDate(t.ready)}/${icsDate(t.when)}`,
  details:`Start getting ready ${hm(t.ready)}. LEAVE BY ${hm(t.leave)}. Actual start ${hm(t.when)}. (${a.buffer} min buffer built in.)`});return 'https://calendar.google.com/calendar/render?'+u}
function nextAppt(){return S.appts.filter(a=>new Date(a.when)>Date.now()).sort((x,y)=>new Date(x.when)-new Date(y.when))[0]}
const mins=ms=>{const m=Math.round(ms/6e4);return m>=120?`${Math.floor(m/60)}h ${m%60}m`:`${m} min`};

/* ---------- views ---------- */
const TABS=[['today','☀','Today'],['focus','⏱','Focus'],['plan','🗓','Plan'],['inbox','✎','Dump'],['more','♡','Support']];
function render(){
  rollover();
  $('#nav').innerHTML=TABS.map(([k,i,l])=>`<button data-a="tab" data-k="${k}" class="${S.tab===k?'on':''}"><span>${i}</span>${l}${k==='inbox'&&S.inbox.length?` (${S.inbox.length})`:''}</button>`).join('');
  $('#view').innerHTML=(V[S.tab]||V.today)();
  if(S.tab==='focus')drawTimer();
}
const VAGUE=/^(clean|tidy|organi[sz]e|sort|work on|do |finish|deal with|fix|study|plan|catch up|get |start )|project|house|taxes|everything|stuff/i;
function taskCard(t){
  return `<div class="card"><div class="row"><div class="grow"><div class="of">${esc(t.title)}</div><div class="step">${esc(t.step||t.title)}</div></div>
  <button class="x" data-a="taskMenu" data-id="${t.id}" aria-label="Task options">⋯</button></div>
  <div class="row" style="margin-top:10px"><button class="pri grow" data-a="startTask" data-id="${t.id}">▶ Start · 10 min</button><button class="ok" data-a="stepDone" data-id="${t.id}">✓ Done</button></div></div>`}
const V={
today(){
  const d=new Date(),must=S.tasks.filter(t=>t.must&&!t.stale),bonus=S.tasks.filter(t=>!t.must&&!t.stale),stale=S.tasks.filter(t=>t.stale);
  const a=nextAppt(),w=winsToday().length,mv=S.moves[dkey()]||0;
  let h=`<p class="mute small">${d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}</p><h1>Right now, just one thing.</h1>`;
  if(a){const t=apptTimes(a),left=t.leave-Date.now();
    h+=`<div class="card banner ${left>30*6e4?'calm':''}"><div class="row"><div class="grow"><b>${esc(a.title)}</b> · ${hm(t.when)}<br><span class="small mute">Get ready ${hm(t.ready)} · leave by <b>${hm(t.leave)}</b></span></div>
    <span class="pill ${left<15*6e4?'hot':''}">${left>0?'leave in '+mins(left):'LEAVE NOW'}</span></div></div>`}
  if(stale.length)h+=`<div class="card banner calm"><b>New day, clean slate.</b><p class="small mute">${stale.length} thing${stale.length>1?'s':''} didn't happen before. That's information, not failure. Keep what still matters.</p>
    ${stale.map(t=>`<div class="row" style="margin-top:8px"><div class="grow">${esc(t.title)}</div><button class="chip" data-a="keep" data-id="${t.id}">Keep</button><button class="chip ghost" data-a="park" data-id="${t.id}">Later</button><button class="chip ghost" data-a="drop" data-id="${t.id}">Drop</button></div>`).join('')}</div>`;
  h+=`<h2>Must-do · ${must.length}/${S.set.limit}</h2>${must.map(taskCard).join('')||`<div class="card mute">Nothing here yet. Pick up to ${S.set.limit}. Everything else is a bonus.</div>`}
  <div class="row"><input id="newTask" placeholder="Add a thing…" enterkeyhint="done"><button class="pri" data-a="addTask">Add</button></div>
  <div class="row" style="margin-top:8px"><button class="grow" data-a="stuck">😵‍💫 I'm stuck</button><button class="grow" data-a="reset">🛟 Wheels fell off</button></div>`;
  if(S.stacks.length)h+=`<h2>Habit stacks</h2><div class="card">${S.stacks.map(s=>`<label class="check" style="margin:0;font-size:16px;color:var(--ink)"><input type="checkbox" data-a="stack" data-id="${s.id}" ${s.last===dkey()?'checked':''}><span class="${s.last===dkey()?'done':''}"><span class="mute">${esc(s.anchor)} →</span> ${esc(s.habit)}</span></label>`).join('')}</div>`;
  h+=`<h2>Move your body</h2><div class="card"><div class="row"><div class="grow">${mv?`<b>${mv} min</b> today. Your brain thanks you.`:'No movement logged yet. Even 10 minutes before a hard task helps.'}</div></div>
    <div class="chips">${[5,10,20,30].map(m=>`<button class="chip" data-a="move" data-m="${m}">+${m} min</button>`).join('')}</div></div>`;
  if(bonus.length)h+=`<h2>Bonus (zero pressure)</h2>${bonus.map(t=>`<div class="card row"><div class="grow">${esc(t.title)}</div><button class="chip" data-a="promote" data-id="${t.id}">↑ Must-do</button><button class="x" data-a="drop" data-id="${t.id}">✕</button></div>`).join('')}`;
  h+=`<p class="mute small" style="text-align:center;margin-top:22px">${w?`${w} win${w>1?'s':''} today · `:''}${S.shown.length} day${S.shown.length===1?'':'s'} you've shown up</p>`;
  return h},
focus(){
  const T=S.timer;
  return `<h1>Focus</h1><p class="mute small">Time you can see. The red shrinks as it goes.</p>
  <div class="card"><div class="of" id="tLabel" style="text-align:center;white-space:normal;font-size:16px;color:var(--ink);font-weight:600">${esc(T?T.label:'Pick a length and go')}</div>
  <svg class="pie" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="var(--soft)" stroke="var(--line)"/>
  <circle id="pie" cx="50" cy="50" r="23" fill="none" stroke="var(--accent)" stroke-width="46" transform="rotate(-90 50 50)" stroke-dasharray="0 999"/>
  ${Array.from({length:12},(_,i)=>`<line x1="50" y1="3" x2="50" y2="${i%3?6:9}" stroke="var(--mute)" stroke-width="${i%3?.6:1.2}" transform="rotate(${i*30} 50 50)"/>`).join('')}<circle cx="50" cy="50" r="2.5" fill="var(--ink)"/></svg>
  <div class="digits" id="digits">--:--</div><p class="mute small" id="ends" style="text-align:center"></p>
  ${T?`<div class="g2"><button data-a="pause">${T.paused?'▶ Resume':'⏸ Pause'}</button><button data-a="addTime">+5 min</button></div><button class="ok big" style="margin-top:8px" data-a="finishEarly">✓ Finished early</button><button class="ghost big" style="margin-top:8px" data-a="stopTimer">Stop</button>`
   :`<div class="chips" style="justify-content:center">${[5,10,15,25,45].map(m=>`<button class="chip" data-a="startTimer" data-m="${m}">${m} min</button>`).join('')}</div>`}</div>
  <h2>Body double</h2><div class="card"><p class="small mute">Someone else being around makes starting easier for a lot of ADHD brains.</p>
  <div class="row wrap"><button class="grow" data-a="textBuddy">💬 Tell ${esc(S.set.buddy||'my person')} I'm starting</button>
  <a class="btn grow" href="https://www.focusmate.com/" target="_blank" rel="noopener">Focusmate</a><a class="btn grow" href="https://www.youtube.com/results?search_query=study+with+me+body+double" target="_blank" rel="noopener">Study-with-me video</a></div></div>
  <h2>Chime every</h2><div class="chips">${[0,5,10,15].map(m=>`<button class="chip ${S.set.chime==m?'pri':''}" data-a="chime" data-m="${m}">${m?m+' min':'off'}</button>`).join('')}</div>
  <p class="small mute">A soft ping while the timer runs so time can't quietly vanish.</p>`},
plan(){
  const now=new Date(Date.now()+36e5);now.setMinutes(0,0,0);const dv=`${dkey(now)}T${pad(now.getHours())}:00`;
  const list=S.appts.slice().sort((x,y)=>new Date(x.when)-new Date(y.when));
  return `<h1>Plan</h1><p class="mute small">Appointments get a buffer automatically. You're told when to <b>leave</b>, not when it starts.</p>
  ${list.map(a=>{const t=apptTimes(a);return `<div class="card"><div class="row"><div class="grow"><b>${esc(a.title)}</b><br><span class="small mute">${t.when.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})} · starts ${hm(t.when)}</span></div><button class="x" data-a="delAppt" data-id="${a.id}">✕</button></div>
   <p>Start getting ready <b>${hm(t.ready)}</b><br>Leave by <b style="color:var(--accent);font-size:20px">${hm(t.leave)}</b> <span class="small mute">(+${a.buffer} buffer)</span></p>
   <div class="row wrap"><a class="btn grow" href="${esc(gcal(a))}" target="_blank" rel="noopener">＋ Google Calendar</a><button class="grow" data-a="ics" data-id="${a.id}">⬇ Calendar file + alarms</button></div></div>`}).join('')}
  <div class="card"><b>New appointment</b>
   <label>What</label><input id="aTitle" placeholder="Dentist">
   <label>Starts</label><input id="aWhen" type="datetime-local" value="${dv}">
   <div class="g2"><div><label>Travel (min)</label><input id="aTravel" type="number" inputmode="numeric" value="20" min="0"></div><div><label>Getting ready (min)</label><input id="aPrep" type="number" inputmode="numeric" value="15" min="0"></div></div>
   <label>Buffer (min) · never zero</label><input id="aBuf" type="number" inputmode="numeric" value="${S.set.buffer}" min="5">
   <button class="pri big" style="margin-top:12px" data-a="addAppt">Work out when to leave</button></div>
  <h2>Habit stacks</h2><p class="small mute">Glue a tiny new habit to something you already do every day. "When X, I will Y" plans are one of the better-tested tricks for ADHD brains.</p>
  ${S.stacks.map(s=>`<div class="card row"><div class="grow"><span class="mute">${esc(s.anchor)} →</span> <b>${esc(s.habit)}</b></div><button class="x" data-a="delStack" data-id="${s.id}">✕</button></div>`).join('')}
  <div class="card"><label>When / while I… (already happens daily)</label><input id="sAnchor" placeholder="my coffee brews">
   <label>I will… (under 2 minutes)</label><input id="sHabit" placeholder="empty the dishwasher top rack">
   <button class="pri big" style="margin-top:12px" data-a="addStack">Add stack</button></div>`},
inbox(){
  return `<h1>Brain dump</h1><p class="mute small">Get it out of your head, go straight back to what you were doing. Sort it later, or never.</p>
  <button class="pri big" data-a="capture">✎ Dump a thought</button>
  ${S.inbox.map(i=>`<div class="card"><div>${esc(i.text)}</div><div class="chips"><button class="chip" data-a="inToTask" data-id="${i.id}">→ Make it a task</button><button class="chip ghost" data-a="inDel" data-id="${i.id}">Let it go</button></div></div>`).join('')||'<div class="card mute">Empty head. Nice.</div>'}`},
more(){
  const G=[['autopay','Every bill is on auto-pay'],['savings','Savings transfer is automatic on payday'],['subs','Subscriptions audited, renewal dates in calendar'],
   ['cards','Saved cards removed from shopping sites'],['oneclick','One-click / shopping apps deleted from phone'],['allowance','Separate "fun money" account for impulse buys'],['wait','24-hour rule: wishlist first, buy tomorrow'],
   ['notif','Notifications off for everything except real humans'],['badges','Red badge counts turned off'],['focusmode','Phone Focus / Do Not Disturb scheduled for work blocks']];
  const dn=G.filter(g=>S.guard[g[0]]).length;
  return `<h1>Support</h1>
  <div class="card"><b>Your person</b><p class="small mute">A sympathetic encourager: someone who helps you sort priorities without shame.</p>
   <div class="g2"><input id="bName" placeholder="Name" value="${esc(S.set.buddy)}"><input id="bPhone" placeholder="Phone" inputmode="tel" value="${esc(S.set.phone)}"></div>
   <div class="row" style="margin-top:8px"><button data-a="saveBuddy">Save</button><button class="pri grow" data-a="sos">💬 "I'm stuck, help me pick"</button></div></div>
  <h2>Guardrails · ${dn}/${G.length} set up</h2><div class="card"><p class="small mute">One-time setup jobs. Each one removes a way for a bad executive-function day to cost you money or attention.</p>
   ${G.map(([k,l])=>`<label class="check" style="margin:0;font-size:16px;color:var(--ink)"><input type="checkbox" data-a="guard" data-k="${k}" ${S.guard[k]?'checked':''}><span class="${S.guard[k]?'done':''}">${l}</span></label>`).join('')}</div>
  <h2>Wins</h2><div class="card">${S.wins.slice(0,12).map(w=>`<div class="small" style="padding:3px 0">✓ ${esc(w.t)} <span class="mute">· ${new Date(w.ts).toLocaleDateString([], {month:'short',day:'numeric'})}</span></div>`).join('')||'<span class="mute">Your done-list shows up here. Proof for the days your brain says you never do anything.</span>'}</div>
  <h2>Why this app works the way it does</h2><div class="card">
   <details><summary>One step, not a list</summary><p class="small">CBT programmes for adult ADHD are the best-tested non-medication approach, and their core skills are exactly this: one calendar, one short task list, break it down, write distractions down instead of following them.</p></details>
   <details><summary>Visible time and loud alarms</summary><p class="small">ADHD is partly a problem of sensing time. Russell Barkley's rule: put the information outside your head, at the place and moment you need it. Hence the shrinking pie, chimes, and "leave by" times.</p></details>
   <details><summary>"When X, I will Y"</summary><p class="small">If-then plans (implementation intentions) improved impulse control and task performance in ADHD studies, though mostly in children in lab settings. Cheap to try, so habit stacks use that exact wording.</p></details>
   <details><summary>Movement</summary><p class="small">Recent meta-analyses in adults with ADHD find a single bout of exercise gives a small-to-moderate boost to symptoms and impulse control, strongest for longer sessions. Best used right before something hard.</p></details>
   <details><summary>Instant wins, no streaks</summary><p class="small">ADHD brains discount delayed rewards more steeply, so every step gets immediate credit. There are no streaks to break: the count of days you showed up only ever goes up.</p></details>
   <details><summary>Body doubling (honest note)</summary><p class="small">Lots of people with ADHD report it helps them start. Controlled experiments haven't confirmed an effect yet. If it works for you, that's enough.</p></details></div>
  <h2>Settings</h2><div class="card">
   <label>Must-do limit</label><select id="limit" data-c="limit">${[3,4,5].map(n=>`<option ${S.set.limit==n?'selected':''}>${n}</option>`).join('')}</select>
   <div class="row wrap" style="margin-top:12px"><button data-a="notifPerm">🔔 Allow alerts</button><button data-a="export">⬇ Backup</button><button data-a="import">⬆ Restore</button></div>
   <p class="small mute">Everything stays on this device. Nothing is sent anywhere.</p></div>`}
};

/* ---------- timer ---------- */
let tick,wake,alarm;
function startTimer(m,label,taskId){audio();S.timer={endAt:Date.now()+m*6e4,total:m*6e4,label:label||`${m} minutes of focus`,taskId:taskId||null,paused:null,lastChime:Date.now()};save();
  S.tab='focus';render();beep(520,.12,1);try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
function drawTimer(){const T=S.timer,p=$('#pie'),d=$('#digits');if(!p)return;
  if(!T){p.setAttribute('stroke-dasharray','0 999');d.textContent='--:--';$('#ends').textContent='';return}
  const left=Math.max(0,T.paused??(T.endAt-Date.now())),C=2*Math.PI*23,f=Math.min(1,left/T.total);
  p.setAttribute('stroke-dasharray',`${f*C} ${C}`);const s=Math.ceil(left/1e3);d.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;
  $('#ends').textContent=T.paused?'Paused':`Ends at ${hm(new Date(T.endAt))}`}
function loop(){
  const T=S.timer;
  if(T&&!T.paused){const left=T.endAt-Date.now();
    if(left<=0){timeUp();}
    else if(S.set.chime>0&&Date.now()-T.lastChime>=S.set.chime*6e4){T.lastChime=Date.now();save();beep(880,.1,1)}}
  if(S.tab==='focus')drawTimer();
  // appointment alerts while the app is open
  for(const a of S.appts){const t=apptTimes(a),n=Date.now();
    if(!a.fr&&n>=t.ready&&n<t.leave){a.fr=1;save();alertAppt(`Start getting ready: ${a.title}`,`Leave by ${hm(t.leave)}`)}
    if(!a.fl&&n>=t.leave&&n<t.when){a.fl=1;save();alertAppt(`LEAVE NOW: ${a.title}`,`Starts ${hm(t.when)}`)}}
}
function alertAppt(t,b){beep(740,.25,3);navigator.vibrate([300,150,300]);notify(t,b);modal(`<h3>⏰ ${esc(t)}</h3><p>${esc(b)}</p><button class="pri big" data-a="close">On it</button>`)}
function timeUp(){const T=S.timer;S.timer=null;save();if(wake){try{wake.release()}catch(e){}wake=null}
  let n=0;beep(660,.25,3);navigator.vibrate([400,200,400]);clearInterval(alarm);alarm=setInterval(()=>{if(++n>20)return clearInterval(alarm);beep(660,.25,3)},2500);
  notify('Time!',T.label);
  modal(`<h3>⏰ Time.</h3><p>${esc(T.label)}</p><p class="mute small">You started. That was the hard part.</p>
   <button class="ok big" data-a="afterDone" data-id="${T.taskId||''}">✓ I did the step</button>
   <div class="g2" style="margin-top:8px"><button data-a="again" data-id="${T.taskId||''}" data-l="${esc(T.label)}">▶ 10 more</button><button data-a="breakT">☕ 5 min break</button></div>
   <button class="ghost big" style="margin-top:8px" data-a="close">Stop here. That counts.</button>`);render()}
const quiet=()=>clearInterval(alarm);

/* ---------- task flows ---------- */
function askStep(title,id,prev){
  const vague=VAGUE.test(title)&&!prev;
  modal(`<h3>${prev?'Nice. What\'s the next tiny step?':'Make it tiny'}</h3><p class="of" style="white-space:normal">${esc(title)}</p>
   ${vague?'<p class="small" style="color:var(--warn)">That sounds big. What could you do in the first 10 minutes?</p>':'<p class="small mute">So small it feels almost silly. 10 minutes or less.</p>'}
   <input id="stepIn" autofocus placeholder="e.g. open the document and type one sentence" enterkeyhint="done">
   <div class="chips">${['Open it and look for 2 minutes','Get out what I need','Put 5 things away','Write the first ugly sentence','Set a 5 min timer and poke at it'].map(c=>`<button class="chip" data-a="chipStep" data-v="${esc(c)}">${c}</button>`).join('')}</div>
   <button class="pri big" style="margin-top:12px" data-a="saveStep" data-id="${id||''}" data-title="${esc(title)}">${prev?'Set next step':'Add it'}</button>
   ${prev?`<button class="ok big" style="margin-top:8px" data-a="taskDone" data-id="${id}">🎉 Whole thing is done</button>`:''}`)}
const find=id=>S.tasks.find(t=>t.id===id);
const mustCount=()=>S.tasks.filter(t=>t.must&&!t.stale).length;

const A={
tab(d){S.tab=d.k;save();render();scrollTo(0,0)},
close(){quiet();closeModal()},
capture(){modal(`<h3>Dump it</h3><textarea id="cap" autofocus placeholder="Random idea, worry, thing to buy…"></textarea>
  <div class="row" style="margin-top:10px">${('webkitSpeechRecognition'in window||'SpeechRecognition'in window)?'<button data-a="mic">🎤</button>':''}<button class="pri grow" data-a="saveCap">Park it → back to work</button></div>`)},
mic(){try{const R=new (window.SpeechRecognition||window.webkitSpeechRecognition)();R.onresult=e=>{$('#cap').value+=(($('#cap').value?' ':'')+e.results[0][0].transcript)};R.start();toast('Listening…')}catch(e){toast('Voice not available here')}},
saveCap(){const v=$('#cap').value.trim();if(v){S.inbox.unshift({id:uid(),text:v,ts:Date.now()});save()}closeModal();render();if(v)toast('Parked. Back to what you were doing.')},
inDel(d){S.inbox=S.inbox.filter(i=>i.id!==d.id);save();render()},
inToTask(d){const i=S.inbox.find(x=>x.id===d.id);if(!i)return;S.inbox=S.inbox.filter(x=>x.id!==d.id);save();askStep(i.text)},
addTask(){const v=$('#newTask').value.trim();if(!v)return toast('Type the thing first');askStep(v)},
chipStep(d){$('#stepIn').value=d.v},
saveStep(d){const step=$('#stepIn').value.trim();let t=d.id&&find(d.id);
  if(t){t.step=step||t.title;win('Step: '+(t.prevStep||t.title))}
  else{const must=mustCount()<S.set.limit;S.tasks.push({id:uid(),title:d.title,step:step||d.title,must,done:false});
    if(!must)toast(`Top ${S.set.limit} is full, so it's in Bonus. That's the system working.`)}
  if(!S.timer)S.tab='today';save();closeModal();render()},
stepDone(d){const t=find(d.id);if(!t)return;t.prevStep=t.step;beep(880,.1,2);askStep(t.title,t.id,true)},
taskDone(d){const t=find(d.id);if(!t)return;win(t.title);S.tasks=S.tasks.filter(x=>x.id!==d.id);S.tab='today';save();closeModal();render();toast('🎉 Done. Logged as a win.')},
startTask(d){const t=find(d.id);if(t)startTimer(10,t.step||t.title,t.id)},
taskMenu(d){const t=find(d.id);if(!t)return;modal(`<h3>${esc(t.title)}</h3><button class="big" data-a="shrink" data-id="${t.id}">🔬 Make the step smaller</button>
  <button class="big" style="margin-top:8px" data-a="park" data-id="${t.id}">→ Move to Bonus</button><button class="big" style="margin-top:8px" data-a="drop" data-id="${t.id}">✕ Drop it (allowed)</button><button class="ghost big" style="margin-top:8px" data-a="close">Cancel</button>`)},
shrink(d){const t=find(d.id);if(!t)return;modal(`<h3>Smaller.</h3><p class="mute small">Current: "${esc(t.step)}". What's half of that? What's the first 2 minutes?</p><input id="stepIn" autofocus placeholder="An even tinier version">
  <button class="pri big" style="margin-top:12px" data-a="saveShrink" data-id="${t.id}">Save</button>`)},
saveShrink(d){const t=find(d.id),v=$('#stepIn').value.trim();if(t&&v){t.step=v;save()}closeModal();render()},
keep(d){const t=find(d.id);if(!t)return;t.stale=false;t.must=mustCount()<S.set.limit;save();render()},
park(d){const t=find(d.id);if(!t)return;t.stale=false;t.must=false;save();closeModal();render()},
promote(d){const t=find(d.id);if(!t)return;if(mustCount()>=S.set.limit)return toast(`Must-do is capped at ${S.set.limit}. Finish or swap one first.`);t.must=true;save();render()},
drop(d){S.tasks=S.tasks.filter(x=>x.id!==d.id);save();closeModal();render();toast('Dropped. One less thing.')},
stack(d){const s=S.stacks.find(x=>x.id===d.id);if(!s)return;if(s.last===dkey())s.last='';else{s.last=dkey();win(s.habit);beep(880,.1,1)}save();render()},
move(d){S.moves[dkey()]=(S.moves[dkey()]||0)+ +d.m;win(`Moved ${d.m} min`);save();render();toast('Logged. That\'s real medicine.')},
stuck(){modal(`<h3>What kind of stuck?</h3>
  <button class="big" data-a="stuckR" data-r="big">🏔 It's too big / I don't know where to start</button>
  <button class="big" style="margin-top:8px" data-a="stuckR" data-r="boring">🥱 It's boring</button>
  <button class="big" style="margin-top:8px" data-a="stuckR" data-r="many">🌪 Too many things, can't choose</button>
  <button class="big" style="margin-top:8px" data-a="stuckR" data-r="flat">🪫 No energy / can't make myself</button>
  <button class="ghost big" style="margin-top:8px" data-a="close">Never mind</button>`)},
stuckR(d){const t=S.tasks.find(x=>x.must&&!x.stale);const R={
  big:`<h3>Shrink it</h3><p>You don't need to do the task. You need to do the first 2 minutes of it. Starting is the whole job right now.</p>${t?`<button class="pri big" data-a="shrink" data-id="${t.id}">Make "${esc(t.step)}" smaller</button>`:'<button class="pri big" data-a="tab" data-k="today">Add one thing</button>'}`,
  boring:`<h3>Add dopamine</h3><p>Boring tasks need borrowed interest. Pick one:</p><p>🎧 Put on a playlist or podcast you only get during this task<br>⏱ Race the clock: how much in 5 minutes?<br>👥 Do it next to someone<br>🍫 Decide the treat for right after</p><button class="pri big" data-a="startTimer" data-m="5">⏱ Race: 5 minutes</button>`,
  many:`<h3>Just pick one</h3><p>They don't all need doing now. Which one would make today feel okay if it was the <i>only</i> thing done? If you truly can't tell, any choice beats no choice.</p>${S.tasks.filter(x=>!x.stale).slice(0,5).map(x=>`<button class="big" style="margin-top:6px" data-a="startTask" data-id="${x.id}">${esc(x.title)}</button>`).join('')}<button class="big" style="margin-top:8px" data-a="sos">💬 Ask ${esc(S.set.buddy||'my person')} to help me pick</button>`,
  flat:`<h3>Body first</h3><p>Don't fight your brain, change its chemistry. Stand up, drink water, and move for 5 minutes: walk outside, stairs, jumping jacks, loud song. Then come back and do only 2 minutes.</p><p class="small mute">Also check: eaten? slept? meds? If today is a low day, lowering the bar is the correct move.</p><button class="pri big" data-a="moveTimer">🚶 5 min movement timer</button>`};
  modal(R[d.r]+`<button class="ghost big" style="margin-top:8px" data-a="close">Close</button>`)},
moveTimer(){closeModal();startTimer(5,'Move your body, then 2 minutes of the thing')},
reset(){modal(`<h3>🛟 Okay. Soft landing.</h3><p>The system failed today. Systems do that. It says nothing about you.</p><p>Everything gets moved to Bonus. Then you pick <b>one</b> small thing, or nothing, and today still counts.</p>
  <button class="pri big" data-a="doReset">Clear my plate</button><button class="ghost big" style="margin-top:8px" data-a="close">Actually I'm okay</button>`)},
doReset(){S.tasks.forEach(t=>{t.must=false;t.stale=false});win('Reset the day instead of spiralling');save();closeModal();render();toast('Plate cleared. Pick one thing, or rest.')},
startTimer(d){closeModal();startTimer(+d.m)},
pause(){const T=S.timer;if(!T)return;if(T.paused){T.endAt=Date.now()+T.paused;T.paused=null}else T.paused=T.endAt-Date.now();save();render()},
addTime(){const T=S.timer;if(!T)return;if(T.paused)T.paused+=3e5;else T.endAt+=3e5;T.total+=3e5;save();drawTimer()},
stopTimer(){S.timer=null;save();render()},
finishEarly(){const T=S.timer;S.timer=null;save();A.afterDone({id:T&&T.taskId||''})},
afterDone(d){quiet();const t=d.id&&find(d.id);if(t){t.prevStep=t.step;askStep(t.title,t.id,true)}else{win('Focus session');closeModal();render();toast('✓ Logged as a win.')}},
again(d){quiet();closeModal();startTimer(10,d.l,d.id)},
breakT(){quiet();closeModal();startTimer(5,'Break. Stand up, water, look out a window.')},
chime(d){S.set.chime=+d.m;save();render()},
textBuddy(){if(!S.set.phone)return toast('Add your person in Support first');const T=S.timer;const end=new Date(T?T.endAt:Date.now()+15*6e4);
  location.href=`sms:${S.set.phone}?&body=${encodeURIComponent(`Starting "${T?T.label:'a focus block'}" now. Check on me at ${hm(end)}?`)}`},
sos(){if(!S.set.phone)return toast('Add your person\'s phone in Support first');const l=S.tasks.filter(t=>!t.stale).slice(0,5).map(t=>'- '+t.title).join('\n');
  location.href=`sms:${S.set.phone}?&body=${encodeURIComponent(`I'm stuck and can't choose. Can you help me pick ONE?\n${l}`)}`},
saveBuddy(){S.set.buddy=$('#bName').value.trim();S.set.phone=$('#bPhone').value.trim();save();toast('Saved')},
guard(d,el){S.guard[d.k]=el.checked;if(el.checked)win('Guardrail set up');save();render()},
addAppt(){const title=$('#aTitle').value.trim(),when=$('#aWhen').value;if(!title||!when)return toast('Needs a name and a time');
  S.appts.push({id:uid(),title,when,travel:+$('#aTravel').value||0,prep:+$('#aPrep').value||0,buffer:Math.max(5,+$('#aBuf').value||S.set.buffer)});save();render();toast('Buffer added. Add it to your calendar so the alarms fire.')},
delAppt(d){S.appts=S.appts.filter(a=>a.id!==d.id);save();render()},
ics(d){const a=S.appts.find(x=>x.id===d.id);if(a)download(`${a.title.replace(/[^\w]+/g,'-')}.ics`,ics(a),'text/calendar')},
addStack(){const anchor=$('#sAnchor').value.trim(),habit=$('#sHabit').value.trim();if(!anchor||!habit)return toast('Fill in both halves');S.stacks.push({id:uid(),anchor:'When '+anchor.replace(/^(when|while|after)\s+/i,''),habit,last:''});save();render()},
delStack(d){S.stacks=S.stacks.filter(s=>s.id!==d.id);save();render()},
notifPerm(){audio();if(!('Notification'in window))return toast('Alerts not supported in this browser');Notification.requestPermission().then(p=>toast(p==='granted'?'Alerts on':'Alerts blocked. Sound still works while the app is open.'))},
export(){download(`anchor-backup-${dkey()}.json`,JSON.stringify(S),'application/json')},
import(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.tasks)throw 0;S={...structuredClone(DEF),...s,set:{...DEF.set,...(s.set||{})}};save();render();toast('Restored')}catch(e){toast('That file didn\'t work')}};r.readAsText(i.files[0])};i.click()}
};
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2e3)}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;audio();const f=A[el.dataset.a];if(f)f(el.dataset,el)});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.a&&el.type==='checkbox'){audio();A[el.dataset.a](el.dataset,el)}if(el.dataset.c==='limit'){S.set.limit=+el.value;save()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT')return;  if(e.target.id==='newTask')A.addTask();else if(e.target.id==='stepIn'){const b=$('#dlg [data-a="saveStep"],#dlg [data-a="saveShrink"]');if(b)b.click()}});
$('#dlg').addEventListener('close',quiet);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();loop()}});
render();tick=setInterval(loop,500);setInterval(()=>{if(S.tab==='today'&&!$('#dlg').open&&document.activeElement.tagName!=='INPUT')render()},6e4);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
